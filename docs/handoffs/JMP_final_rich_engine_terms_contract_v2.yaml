undefined_items:
  count: 0
  items: []
  note: >-
    Every field requested by the Goal-2 request was resolvable from the frozen
    record, the frozen frame metadata, or the implementing source at the pinned
    gitlink. Sections C and D are NOT_ACTIVE_IN_FINAL_MODEL rather than
    UNDEFINED: the determination that the object is absent is itself a positive
    reading of the record, and the actual Goal-1 object is named in each case.

# =========================================================================== #
# REPRODUCTION CAUTIONS (the traps a package-side reimplementation will hit)
# =========================================================================== #
reproduction_cautions:
  - id: C-1
    caution: "There is no single parseable YAML for this model. The base parse is extended twice in Goal-1 mission code (A_final_model_binding.executable_specification_is_built_in_code)."
  - id: C-2
    caution: "wage_spec is 'vw', not 'loc_empirical' and not 'vw_occupation'. The occupation conditioning is three extra wage MEAN SHIFTERS with a SHARED sigma."
  - id: C-3
    caution: "pexp_years is raw years / 20.0 for the STRUCTURAL block; pexp_years_raw is what the PROPOSAL uses. pexp_years2 is recomputed in the loader as (raw/20)^2 and any frame column of that name is ignored."
  - id: C-4
    caution: "Under S8 the hours reference is the UNCOVERED region at exp(0), not F35. The reporting.hours_bins 'reference: true' flag on f35 describes the base spec and is stale for the final model."
  - id: C-5
    caution: "beta_h_f35 is provenance index 50 and preferred active index 40, appended last in both layouts. The original 51-vector order binds its historical theta digest; see G_coordinate_representations_v2 for the active map."
  - id: C-6
    caution: "working_f35 is built by Goal-1 mission code onto the engine-ready frame; the package loader at the pin does not know the column name."
  - id: C-7
    caution: "The wage log-density carries the Jacobian term -log_wage. Omitting it gives a density in log w, not in w, and will not reproduce the anchor."
  - id: C-8
    caution: "The occupation ACCESS coefficients are sex-specific; the occupation WAGE LOCATION shifts are sex-common. They read the SAME loc4_k columns."
  - id: C-9
    caution: "The market index is proposal-weighted centered within the choice set AFTER the occupation access shifters are summed into it. The wage location shifts are not centered."
  - id: C-10
    caution: "The engine reads the materialized `prior` column and takes its own log, after an EPS floor in the loader. It does not read log_prior."
  - id: C-11
    caution: "n_children is ZEROED by the loader for the male singles group because the shifter is declared gender_specific."
  - id: C-12
    caution: "Goal-2's public main b042431c is not the pin the anchor was produced under. The anchor binds to gitlink 27756a06."

